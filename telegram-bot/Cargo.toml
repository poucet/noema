[package]
name = "telegram-bot"
version.workspace = true
edition.workspace = true
description = "Telegram bot for the Simply platform"

[[bin]]
name = "telegram"
path = "src/main.rs"

[features]
default = ["embedded"]
embedded = []

[dependencies]
# Internal crates
config = { workspace = true }
simply-daemon-api = { workspace = true }
simply-daemon = { workspace = true }
simply-rpc = { workspace = true }
mcp-gdocs = { workspace = true, features = ["skill"] }

# Async runtime
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }

# HTTP and serialization
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
anyhow = { workspace = true }

# MCP result types
rmcp = { workspace = true }

# URLs
urlencoding = { workspace = true }
