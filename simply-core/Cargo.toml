[package]
name = "simply-core"
version.workspace = true
edition.workspace = true

[features]
default = []
sqlite = ["rusqlite", "dep:sqlite-vec"]
rusqlite = ["dep:rusqlite"]
ts = ["dep:ts-rs", "llm/ts"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "fs", "io-util"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tracing = { workspace = true }
llm = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "transport-worker"] }
config = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
cron = { workspace = true }
askama = "0.12"

# Blob storage (CAS)
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

# Optional SQLite support
rusqlite = { version = "0.34", features = ["bundled"], optional = true }
sqlite-vec = { version = "0.1", optional = true }

# UUID for ID generation (always required)
uuid = { workspace = true }

# TypeScript type generation (optional)
ts-rs = { version = "10", features = ["serde-compat"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
serde_json = { workspace = true }
schemars = { workspace = true }
