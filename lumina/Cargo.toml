[package]
name = "lumina"
version.workspace = true
edition.workspace = true
description = "Lumina — Discord bot for the Simply platform"

[[bin]]
name = "lumina"
path = "src/main.rs"

[dependencies]
# Internal crates
config = { path = "../config" }
simply-daemon = { path = "../simply-daemon" }
simply-rpc = { path = "../simply-rpc" }

# Discord
serenity = { version = "0.12", default-features = false, features = [
    "client",
    "gateway",
    "model",
    "rustls_backend",
] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
