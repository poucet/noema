[package]
name = "lumina"
version.workspace = true
edition.workspace = true
description = "Lumina — Discord bot for the Simply platform"

[[bin]]
name = "lumina"
path = "src/main.rs"

[dependencies]
# Internal crates
config = { path = "../config" }
lumina-macros = { path = "macros" }
simply-daemon = { path = "../simply-daemon" }
simply-rpc = { path = "../simply-rpc" }

# Discord
serenity = { version = "0.12", default-features = false, features = [
    "cache",
    "client",
    "collector",
    "gateway",
    "model",
    "rustls_backend",
] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Encoding
base64 = "0.22"

# Error handling
anyhow = "1"

# Auto-registration
inventory = "0.3"

# Async trait
async-trait = "0.1"

# MCP server
rmcp = { version = "1.3", features = ["server", "macros"] }
schemars = "0.8"
