[package]
name = "simply-rpc"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
matchit = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simply-rpc-macros = { path = "macros" }
tokio = { version = "1", features = ["sync", "net", "rt", "time", "macros"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "sync"] }
reqwest = { version = "0.12", features = ["json"] }
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
tokio-tungstenite = "0.26"
futures-util = "0.3"
