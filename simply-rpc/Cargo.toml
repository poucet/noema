[package]
name = "simply-rpc"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simply-rpc-macros = { path = "macros" }

[dev-dependencies]
tokio = { version = "1", features = ["full", "sync"] }
