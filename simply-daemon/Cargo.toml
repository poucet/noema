[package]
name = "simply-daemon"
version.workspace = true
edition.workspace = true
description = "Simply platform daemon — trait-based API with in-process and remote implementations"

[lib]
name = "simply_daemon"
path = "src/lib.rs"

[[bin]]
name = "simply-daemon"
path = "src/main.rs"

[dependencies]
# Internal crates
config = { workspace = true }
simply-core = { workspace = true, features = ["sqlite"] }
simply-rpc = { workspace = true }
simply-voice = { workspace = true, features = ["whisper", "voxtral", "gemini", "elevenlabs"] }
llm = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }

# Serialization / schemas
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Encoding
base64 = { workspace = true }

# Error handling
anyhow = { workspace = true }

# OAuth / HTTP client
reqwest = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
urlencoding = { workspace = true }

# WebSocket
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

# MCP protocol
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }

# HTTP/WS server
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
tower-service = { workspace = true }
http-body-util = { workspace = true }
