[package]
name = "simply-daemon"
version.workspace = true
edition.workspace = true
description = "Simply platform daemon — trait-based API with in-process and remote implementations"

[lib]
name = "simply_daemon"
path = "src/lib.rs"

[[bin]]
name = "simply-daemon"
path = "src/main.rs"

[dependencies]
# Internal crates
config = { path = "../config" }
simply-core = { path = "../simply-core", features = ["sqlite"] }
llm = { path = "../simply-core/llm" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Encoding
base64 = "0.22"

# Error handling
anyhow = "1"

# OAuth / HTTP client
reqwest = { version = "0.12", features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
urlencoding = "2"

# WebSocket
tokio-tungstenite = "0.24"
futures-util = "0.3"

# MCP protocol
rmcp = { version = "0.9", features = ["server", "transport-streamable-http-server"] }

# HTTP server (for MCP server hosting)
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-service = "0.3"
http-body-util = "0.1"
