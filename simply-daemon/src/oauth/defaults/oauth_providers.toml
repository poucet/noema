# OAuth provider identity and user-configured credentials.
# Copied to ~/.local/share/noema/oauth_providers.toml on first run.
#
# Fill in client_id and client_secret for each provider you want to use.
# These credentials survive MCP server add/remove — they live here, not in mcp.toml.
#
# Scopes are NOT stored here. They are declared per-consumer:
#   - MCP servers: in mcp.toml under [servers.*.auth]
#   - Skills: declared in code via OAuthRequirement

[google]
display_name = "Google"
authorization_url = "https://accounts.google.com/o/oauth2/v2/auth"
token_url = "https://oauth2.googleapis.com/token"
userinfo_url = "https://www.googleapis.com/oauth2/v2/userinfo"
client_id = ""
# client_secret = ""

[github]
display_name = "GitHub"
authorization_url = "https://github.com/login/oauth/authorize"
token_url = "https://github.com/login/oauth/access_token"
userinfo_url = "https://api.github.com/user"
client_id = ""
# client_secret = ""

[notion]
display_name = "Notion"
authorization_url = "https://api.notion.com/v1/oauth/authorize"
token_url = "https://api.notion.com/v1/oauth/token"
client_id = ""
# client_secret = ""
