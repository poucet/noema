<!DOCTYPE html>
<html>
<head>
<title>simply-daemon</title>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #1a1a2e; color: #e0e0e0; }
  h1 { font-size: 1.4em; color: #fff; }
  h2 { font-size: 1.1em; color: #ccc; margin-top: 30px; }
  table { width: 100%; border-collapse: collapse; margin: 10px 0 20px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #333; font-size: 0.9em; }
  th { color: #888; font-weight: 500; font-size: 0.8em; text-transform: uppercase; }
  .count { color: #888; font-weight: normal; font-size: 0.9em; }
  .empty { text-align: center; color: #555; font-style: italic; }
  .actions { margin: 30px 0; }
  button { background: #c0392b; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
  button:hover { background: #e74c3c; }
  button:disabled { background: #555; cursor: not-allowed; }
  #status { margin-top: 10px; font-size: 0.85em; color: #888; }
  .section { margin-bottom: 10px; }
</style>
</head>
<body>
<h1>simply-daemon</h1>

<h2>Connections <span class="count" id="conn-count"></span></h2>
<table>
  <thead><tr><th>ID</th><th>Client</th><th>Address</th><th>Connected</th></tr></thead>
  <tbody id="connections"></tbody>
</table>

<h2>Sessions <span class="count" id="session-count"></span></h2>
<table>
  <thead><tr><th>ID</th><th>Model</th><th>Persistence</th><th>Created</th></tr></thead>
  <tbody id="sessions"></tbody>
</table>

<h2>Models</h2>
<div id="models" class="section"></div>

<div class="actions">
  <button onclick="killDaemon()" id="killBtn">Kill Daemon</button>
  <div id="status"></div>
</div>

<script>
const REST = ''; // Same origin

async function loadConnections() {
  try {
    const res = await fetch('/admin/api/connections');
    const conns = await res.json();
    document.getElementById('conn-count').textContent = `(${conns.length})`;
    const tbody = document.getElementById('connections');
    if (conns.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty">No connections</td></tr>';
    } else {
      tbody.innerHTML = conns.map(c =>
        `<tr><td>${c.id}</td><td>${c.name || '<span style="color:#555">—</span>'}</td><td>${c.addr}</td><td>${c.connected_at}</td></tr>`
      ).join('');
    }
  } catch (e) {
    document.getElementById('conn-count').textContent = '(error)';
  }
}

async function loadSessions() {
  try {
    const res = await fetch(REST + '/session');
    const sessions = await res.json();
    document.getElementById('session-count').textContent = `(${sessions.length})`;
    const tbody = document.getElementById('sessions');
    if (sessions.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty">No active sessions</td></tr>';
    } else {
      tbody.innerHTML = sessions.map(s =>
        `<tr><td>${s.id}</td><td>${s.model_id}</td><td>${s.persistence}</td><td>${s.created_at}</td></tr>`
      ).join('');
    }
  } catch (e) {
    document.getElementById('session-count').textContent = '(error)';
  }
}

async function loadModels() {
  try {
    const res = await fetch(REST + '/model/default');
    const defaultModel = await res.json();
    document.getElementById('models').textContent = `Default: ${defaultModel}`;
  } catch (e) {
    document.getElementById('models').textContent = 'Could not load models';
  }
}

async function killDaemon() {
  if (!confirm('Shut down the daemon?')) return;
  const btn = document.getElementById('killBtn');
  btn.disabled = true;
  btn.textContent = 'Shutting down...';
  try {
    await fetch(REST + '/daemon/kill', { method: 'POST' });
    document.getElementById('status').textContent = 'Shutdown signal sent.';
  } catch (e) {
    document.getElementById('status').textContent = 'Sent (daemon may be down).';
  }
}

loadConnections();
loadSessions();
loadModels();
setInterval(loadConnections, 5000);
setInterval(loadSessions, 5000);
</script>
</body>
</html>
