<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Lumina setup</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --fg:#e8eaed; --muted:#9aa0aa; --acc:#5865f2; --ok:#3ba55d; --line:#2a2e37; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,sans-serif; }
  .wrap { max-width:560px; margin:6vh auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .steps { display:flex; gap:6px; margin:0 0 22px; }
  .steps .dot { flex:1; height:4px; border-radius:2px; background:var(--line); }
  .steps .dot.active { background:var(--acc); }
  label { display:block; font-weight:600; margin:14px 0 5px; }
  .hint { color:var(--muted); font-weight:400; font-size:13px; }
  input { width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--line);
          background:#0c0e12; color:var(--fg); font-size:14px; }
  input:focus { outline:none; border-color:var(--acc); }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; }
  .btns { display:flex; justify-content:space-between; margin-top:24px; }
  button { padding:10px 18px; border-radius:9px; border:0; font-size:14px; font-weight:600; cursor:pointer; }
  .primary { background:var(--acc); color:#fff; }
  .ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  a.invite { display:inline-block; margin-top:10px; padding:9px 14px; border-radius:9px;
             background:var(--acc); color:#fff; text-decoration:none; font-weight:600; }
  a.invite[aria-disabled="true"] { pointer-events:none; opacity:.5; }
  .soon { display:inline-block; margin-top:8px; padding:8px 12px; border:1px dashed var(--line);
          border-radius:9px; color:var(--muted); font-size:13px; }
  .step { display:none; }
  .step.active { display:block; }
  .err { color:#f08; margin-top:12px; min-height:18px; font-size:13px; }
  code { background:#0c0e12; padding:1px 5px; border-radius:5px; }
  .done { text-align:center; padding:18px 0; }
  .done .big { font-size:40px; }
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>Welcome to Lumina</h1>
  <p class="sub">A few details and your bot is live. This page disappears once setup is done.</p>
  <div class="steps">
    <div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>

  <!-- Step 1: LLM -->
  <section class="step active" data-step="0">
    <label>LLM provider <span class="hint">— key name, e.g. mistral / claude / openai</span></label>
    <input id="llm_provider" value="mistral" />
    <label>API key</label>
    <input id="llm_api_key" type="password" placeholder="sk-…" />
    <label>Default model <span class="hint">— format <code>provider/models/id</code></span></label>
    <input id="default_model" placeholder="mistral/models/mistral-large-latest" />
  </section>

  <!-- Step 2: You -->
  <section class="step" data-step="1">
    <label>Your email <span class="hint">— the owner identity</span></label>
    <input id="email" type="email" placeholder="you@example.com" />
    <div class="soon">🔒 Sign in with Google (admin login) — coming soon</div>
  </section>

  <!-- Step 3: Discord -->
  <section class="step" data-step="2">
    <label>Discord bot token <span class="hint">— Developer Portal → Bot</span></label>
    <input id="discord_bot_token" type="password" placeholder="bot token" />
    <label>Application ID <span class="hint">— Developer Portal → General Information</span></label>
    <input id="discord_app_id" placeholder="numeric application id" oninput="updateInvite()" />
    <a class="invite" id="invite" aria-disabled="true" target="_blank" rel="noopener">Invite the bot →</a>
    <div class="row">
      <div><label>Owner ID <span class="hint">optional</span></label><input id="owner_id" placeholder="your discord user id" /></div>
      <div><label>Guild IDs <span class="hint">optional, comma-sep</span></label><input id="guild_ids" placeholder="123, 456" /></div>
    </div>
  </section>

  <!-- Step 4: Google -->
  <section class="step" data-step="3">
    <label>Google OAuth client ID <span class="hint">— Cloud Console → Credentials</span></label>
    <input id="google_client_id" placeholder="…apps.googleusercontent.com" />
    <label>Google OAuth client secret</label>
    <input id="google_client_secret" type="password" placeholder="client secret" />
    <p class="hint" style="margin-top:12px">Add this Authorized redirect URI in Google:<br/>
      <code id="redirect_uri"></code></p>
  </section>

  <!-- Done -->
  <section class="step" data-step="4">
    <div class="done"><div class="big">🎉</div>
      <p>Setup complete — your bot is starting. This page is now closed.</p>
    </div>
  </section>

  <div class="err" id="err"></div>
  <div class="btns" id="btns">
    <button class="ghost" id="back" onclick="go(-1)" style="visibility:hidden">Back</button>
    <button class="primary" id="next" onclick="go(1)">Next</button>
  </div>
</div></div>

<script>
  const PUBLIC_URL = "{{PUBLIC_URL}}".replace(/\/+$/, "");
  const INVITE_PERMISSIONS = "{{INVITE_PERMISSIONS}}";
  const INVITE_SCOPES = "{{INVITE_SCOPES}}".replace(/ /g, "+");
  const TOKEN = new URLSearchParams(location.search).get("token") || "";
  const LAST = 4; // index of the "done" step

  let step = 0;
  document.getElementById("redirect_uri").textContent = PUBLIC_URL + "/auth/mcp/callback";

  function updateInvite() {
    const id = document.getElementById("discord_app_id").value.trim();
    const a = document.getElementById("invite");
    if (/^\d+$/.test(id)) {
      a.href = `https://discord.com/oauth2/authorize?client_id=${id}&scope=${INVITE_SCOPES}&permissions=${INVITE_PERMISSIONS}`;
      a.setAttribute("aria-disabled", "false");
    } else {
      a.removeAttribute("href");
      a.setAttribute("aria-disabled", "true");
    }
  }

  function show() {
    document.querySelectorAll(".step").forEach(s => s.classList.toggle("active", +s.dataset.step === step));
    document.querySelectorAll(".steps .dot").forEach((d, i) => d.classList.toggle("active", i <= step));
    document.getElementById("back").style.visibility = step === 0 ? "hidden" : "visible";
    const next = document.getElementById("next");
    next.textContent = step === 3 ? "Finish" : "Next";
    document.getElementById("btns").style.display = step === LAST ? "none" : "flex";
    document.getElementById("err").textContent = "";
  }

  function val(id) { return document.getElementById(id).value.trim(); }

  function validate() {
    if (step === 0 && (!val("llm_provider") || !val("llm_api_key") || !val("default_model")))
      return "Provider, API key and default model are required.";
    if (step === 1 && !val("email")) return "Email is required.";
    if (step === 2 && !val("discord_bot_token")) return "Discord bot token is required.";
    if (step === 3 && (!val("google_client_id") || !val("google_client_secret")))
      return "Google client id and secret are required.";
    return null;
  }

  async function go(dir) {
    if (dir > 0) {
      const e = validate();
      if (e) { document.getElementById("err").textContent = e; return; }
      if (step === 3) { return submit(); }
    }
    step = Math.max(0, Math.min(LAST, step + dir));
    show();
  }

  function numOrNull(id) { const v = val(id); return /^\d+$/.test(v) ? Number(v) : null; }
  function idList(id) {
    const v = val(id); if (!v) return null;
    const out = v.split(",").map(s => s.trim()).filter(s => /^\d+$/.test(s)).map(Number);
    return out.length ? out : null;
  }

  async function submit() {
    const next = document.getElementById("next");
    next.disabled = true; next.textContent = "Saving…";
    const body = {
      email: val("email"),
      default_model: val("default_model"),
      llm_provider: val("llm_provider"),
      llm_api_key: val("llm_api_key"),
      discord_bot_token: val("discord_bot_token"),
      owner_id: numOrNull("owner_id"),
      guild_ids: idList("guild_ids"),
      model_id: val("default_model") || null,
      google_client_id: val("google_client_id"),
      google_client_secret: val("google_client_secret"),
      public_url: PUBLIC_URL,
    };
    try {
      const r = await fetch("/setup/api/complete", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Setup-Token": TOKEN },
        body: JSON.stringify(body),
      });
      if (!r.ok) throw new Error(await r.text() || ("HTTP " + r.status));
      step = LAST; show();
    } catch (e) {
      document.getElementById("err").textContent = "Failed: " + e.message;
      next.disabled = false; next.textContent = "Finish";
    }
  }

  show();
</script>
</body>
</html>
