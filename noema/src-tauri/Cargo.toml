[package]
name = "noema"
version.workspace = true
edition.workspace = true
description = "Noema AI Chat Application"
authors.workspace = true

[lib]
name = "noema_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-fs = "2"
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { version = "10", features = ["serde-compat", "serde-json-impl"] }
tokio = { workspace = true, features = ["full", "fs", "io-util"] }
futures = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
url = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
urlencoding = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
regex = "1"
# Local workspace dependencies
config = { workspace = true }
simply-audio = { workspace = true, features = ["browser", "backend-cpal"] }
simply-voice = { workspace = true }
simply-daemon = { workspace = true }
simply-rpc = { workspace = true }
mcp-gdocs = { workspace = true }
thiserror = "2.0.17"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
dirs = { workspace = true }

[features]
custom-protocol = ["tauri/custom-protocol"]
native-audio = ["simply-audio/backend-cpal"]
