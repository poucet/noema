[package]
name = "noema"
version.workspace = true
edition.workspace = true
description = "Noema AI Chat Application"
authors.workspace = true

[lib]
name = "noema_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-fs = "2"

# serde_json is required by `tauri::generate_context!` even if we don't use it directly
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"

# Daemon + RPC
config = { workspace = true }
simply-daemon = { workspace = true }
simply-rpc = { workspace = true }

# Deep-link parsing + HTTP client for OAuth forwarding
url = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["full"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
dirs = { workspace = true }

[features]
custom-protocol = ["tauri/custom-protocol"]
