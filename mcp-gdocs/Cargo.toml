[package]
name = "mcp-gdocs"
version.workspace = true
edition.workspace = true
description = "Google Docs MCP server"

[lib]
name = "mcp_gdocs"
path = "src/lib.rs"

[[bin]]
name = "mcp-gdocs"
path = "src/main.rs"

[features]
default = []
skill = ["dep:simply-daemon-api", "dep:async-trait", "dep:llm", "dep:schemars"]

[dependencies]
# MCP protocol
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }

# Skill system (optional — for embedding as daemon skill)
simply-daemon-api = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
llm = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# HTTP server
hyper = { workspace = true }
hyper-util = { workspace = true }
tower-service = { workspace = true }
http-body-util = { workspace = true }
http = "1"

# HTTP client for Google APIs
reqwest = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Utilities
base64 = { workspace = true }
chrono = { workspace = true }
html2md = "0.2"
