# nginx site for Lumina — install on the HOST (e.g.
# /etc/nginx/sites-available/lumina, symlinked into sites-enabled), then
# `nginx -t && systemctl reload nginx`. Certs are your existing Certbot ones.
#
# SECURITY: only the OAuth routes are proxied to the daemon. The daemon listens
# on 127.0.0.1:9800 (host loopback, via the container's `network_mode: host`)
# and treats every loopback connection as ADMIN — so this allowlist is the
# entire security boundary. Do NOT add a catch-all `location /` proxy.

server {
    if ($host = lumina.simplychris.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name lumina.simplychris.ai;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name lumina.simplychris.ai;

    ssl_certificate /etc/letsencrypt/live/lumina.simplychris.ai/fullchain.pem;     # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lumina.simplychris.ai/privkey.pem;   # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                               # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                                 # managed by Certbot

    # The OAuth routes that reach the daemon:
    #   GET /auth/mcp/{id}       — start a user's OAuth flow
    #   GET /auth/mcp/callback   — Google's redirect target
    location /auth/mcp/ {
        proxy_pass http://127.0.0.1:9800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # First-run setup wizard. The daemon gates this on a one-time token and 404s
    # it once configured, so it is safe to expose (and self-closing).
    location /setup {
        proxy_pass http://127.0.0.1:9800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else — admin UI, /admin/api, /api, /ws — is blocked.
    location / {
        return 404;
    }
}
